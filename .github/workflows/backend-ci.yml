# Backend CI — restore + build + test + migration-check on every PR and on the long-lived branches.
# On main, additionally build the release image.
#
# Deploy is deliberately NOT here: pushing an image and rolling a server carry secrets and belong to a
# protected GitHub Environment. See backend/ops/HETZNER_EXIT_RUNBOOK.md.
name: backend-ci

on:
  pull_request:
    branches: [main, dev, test]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main, dev, test]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

# One in-flight run per ref; a newer push cancels the older.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

defaults:
  run:
    # The solution lives one level down since the backend moved into the iOS repository.
    working-directory: backend

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    # No postgres service container: the API integration tests own their database through
    # Testcontainers (PostgresFixture), and the fixture now re-registers AppDbContext in
    # ConfigureTestServices so the container's connection string actually reaches the app.
    # A service container here would only mask a regression of that wiring.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: restore
        run: dotnet restore Paybitch.sln
      - name: build
        run: dotnet build Paybitch.sln -c Release --no-restore
      - name: test
        run: dotnet test Paybitch.sln -c Release --no-build --verbosity normal

  migration-check:
    name: migration-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version 10.*
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      # Fails the PR if the EF model drifted from the committed migrations (a schema change with no
      # migration). Compares model ↔ snapshot only — no database connection needed.
      - name: assert no pending model changes
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Paybitch.Infrastructure
          --startup-project src/Paybitch.Api

  build-image:
    name: build image
    runs-on: ubuntu-latest
    needs: [build-test, migration-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build release image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false # flip on once registry creds live in a protected environment
          load: true
          tags: paybitch-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
